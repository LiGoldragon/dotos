[package]
name         = "dotos"
version = "0.10.1"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/dotos"
description  = "Structural DOTOS reader for the schema-derived stack."
publish      = false

[lib]
name = "dotos"
path = "src/lib.rs"

[dependencies]
dotos-derive = { path = "derive" }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"

[workspace]
members = ["derive"]
